# kan.bn Docker Compose
# Docs: https://docs.kan.bn/guides/self-hosting/introduction
#
# Quick reference:
#   Start services:     docker compose up -d
#   Stop services:      docker compose down
#   View logs:          docker compose logs -f
#   Restart services:   docker compose restart
#   Run migrations:     docker compose --profile migrate run --rm migrate

services:

  # ── Migration runner ────────────────────────────────────────────────────────
  # One-shot service that applies database schema changes.
  # Run before first launch and after each image upgrade:
  #   docker compose --profile migrate run --rm migrate
  migrate:
    image: ghcr.io/kanbn/kan-migrate:latest
    container_name: kan-migrate
    profiles:
      - migrate
    networks:
      - kan-network
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Web application ─────────────────────────────────────────────────────────
  web:
    image: ghcr.io/kanbn/kan:latest
    container_name: kan-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - kan-network
    # env_file passes only the variables that are actually defined (and
    # uncommented) in .env. This prevents empty strings from reaching the
    # app's environment validation for optional URL/string fields.
    env_file:
      - .env
    environment:
      # Hardcoded — not user-configurable; required by Better Auth.
      - NEXT_PUBLIC_ALLOW_CREDENTIALS=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: kan-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-kan_db}
      - POSTGRES_USER=${POSTGRES_USER:-kan}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # Port 5432 is not exposed to the host by default; all inter-service
    # communication happens over the internal kan-network.
    # Uncomment the lines below only if you need direct external DB access
    # (e.g. a local GUI client during development):
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${DOCKER_DATA_PATH:-kan_data}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kan} -d ${POSTGRES_DB:-kan_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - kan-network

networks:
  kan-network:
    driver: bridge
